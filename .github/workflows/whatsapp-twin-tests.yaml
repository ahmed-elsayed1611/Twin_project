name: WhatsApp Twin tests

on:
  push:
    paths:
      - "whatsapp-twin/**"
      - ".github/workflows/whatsapp-twin-tests.yaml"
  pull_request:
    paths:
      - "whatsapp-twin/**"
      - ".github/workflows/whatsapp-twin-tests.yaml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The main CI excludes whatsapp-twin from its style lint (ruff.toml). This checks it for real bugs only:
      # unused or undefined names (pyflakes). The harnesses' `from harness import *` is deliberate (F403/F405).
      - name: Lint for real bugs (pyflakes)
        run: |
          pip install ruff==0.4.10
          ruff check whatsapp-twin --isolated --select F --ignore F403,F405

      - name: Data preparation (standard library only)
        run: python -m unittest discover -s whatsapp-twin/data-preparation/tests -v

      - name: Notebooks run top to bottom
        run: python whatsapp-twin/tools/check_notebook_order.py whatsapp-twin/*/notebooks/*.ipynb

      - name: ZenML ingestion prototype (extractor)
        run: |
          pip install pydantic pytest
          cd whatsapp-twin/zenml-ingestion-prototype && python -m pytest llm_engineering/tests
